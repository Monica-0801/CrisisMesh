<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CrisisMesh | Secure Login</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#164156,#07111a 45%);color:#f4f8fb;font:14px system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:32px;background:#0d1d2a;border:1px solid #1d3a4d;border-radius:22px;box-shadow:0 20px 60px #0007}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#47d6e9;color:#06131e;font-size:25px;font-weight:900}.eyebrow{color:#47d6e9;font-size:11px;font-weight:800;letter-spacing:.16em;margin:20px 0 5px}.card h1{margin:0 0 8px}.muted{color:#8da7b8;margin:0 0 25px}label{display:block;color:#a9c0cc;font-size:12px;margin:15px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #1d3a4d;background:#081720;color:#fff;outline:none}input:focus,select:focus{border-color:#47d6e9}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#47d6e9;color:#06131e;font-weight:800;cursor:pointer}#message{min-height:20px;margin-top:15px;color:#ff969b;font-size:12px}.hint{margin-top:20px;padding-top:15px;border-top:1px solid #ffffff12;color:#718b99;font-size:11px;line-height:1.5}
  </style>
</head>
<body><main class="card"><div class="mark">+</div><p class="eyebrow" id="eyebrow">SECURE WORKSPACE LOGIN</p><h1 id="title">Welcome back</h1><p class="muted" id="subtitle">Sign in to continue to your CrisisMesh workspace.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Minimum 8 characters"><button>Sign in securely</button></form><div id="message"></div><div class="hint">Your account role controls which workspace opens after sign-in.<br><br><a href="/" style="color:#47d6e9">← Choose another workspace</a> · <a href="/register.html" style="color:#47d6e9">Create common-user account</a></div></main>
<script>
  const message=document.querySelector('#message'), query=new URLSearchParams(location.search), requestedRole=query.get('role')||'CommonUser';
  const labels={Admin:['ADMINISTRATOR LOGIN','Admin workspace'],Rescue:['RESCUE TEAM LOGIN','Rescue command center'],CommonUser:['COMMON USER LOGIN','Victim mobile app']};
  document.querySelector('#eyebrow').textContent=labels[requestedRole]?.[0]||labels.CommonUser[0];document.querySelector('#subtitle').textContent=`Sign in to open your ${labels[requestedRole]?.[1]||labels.CommonUser[1]}.`;
  document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();message.textContent='Signing in...';const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value,requestedRole})});const result=await response.json();if(!response.ok){message.textContent=result.message||'Sign-in failed.';return}if(result.role==='CommonUser'){message.textContent='Opening CrisisMesh on the device...';location.href='crisismesh://open';return}location.href='/dashboard.html';});
</script></body></html>
