<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrisisMesh | Create account</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111a;color:#f4f8fb;font:14px system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:30px;background:#0d1d2a;border:1px solid #1d3a4d;border-radius:20px}h1{margin:0 0 8px}p{color:#8da7b8}label{display:block;margin:15px 0 6px;color:#a9c0cc;font-size:12px}input{width:100%;padding:12px;box-sizing:border-box;border-radius:9px;border:1px solid #1d3a4d;background:#081720;color:#fff}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:#47d6e9;font-weight:800}#message{margin-top:14px;color:#ff969b;font-size:12px}</style></head><body><main class="card"><h1>Create common-user account</h1><p>Common-user accounts open the CrisisMesh mobile app. Rescue and administrator accounts are provisioned separately.</p><form id="form"><label>Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><button>Create account</button></form><div id="message"></div></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:document.querySelector('#name').value,email:document.querySelector('#email').value,password:document.querySelector('#password').value,role:'CommonUser'})});const text=await r.json();document.querySelector('#message').textContent=text.message||'Account created.';if(r.ok)setTimeout(()=>location.href='/login.html?role=CommonUser',700)});</script></body></html>
